[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsclf"
version = "0.1.0"
description = "Newsgroup text classification (Machine Learning Project WiSe 2026/27, Project 5)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
